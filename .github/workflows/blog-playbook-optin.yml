name: Blog Playbook opt-in guard

on:
  pull_request:
    paths:
      - 'blog/**'
      - 'scripts/check_blog_playbook_optin.py'
      - '.github/workflows/blog-playbook-optin.yml'
      - 'index.html'
  push:
    branches:
      - main
    paths:
      - 'blog/**'
      - 'scripts/check_blog_playbook_optin.py'
      - '.github/workflows/blog-playbook-optin.yml'
      - 'index.html'

permissions:
  contents: read

jobs:
  prevent-ungated-playbook-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate blog Playbook CTAs
        run: python3 scripts/check_blog_playbook_optin.py
